# Builds the CHUD STREAMS APK for Fire TV (Fire TV Stick 4K Max and other Fire OS 7/8 devices).
#
# Run it from the Actions tab ("Build CHUD STREAMS for Fire TV" > Run workflow) or push to main/master.
# The APK appears under the run's "Artifacts" as chud-streams-apk.
#
# Optional but recommended: stable signing, so each new APK installs over the last one
# without losing your accounts and favourites. Add these repository secrets
# (Settings > Secrets and variables > Actions):
#   DIAL_KEYSTORE_BASE64    base64 of your .jks file
#   DIAL_KEYSTORE_PASSWORD
#   DIAL_KEY_ALIAS
#   DIAL_KEY_PASSWORD
# DIAL.md shows the two commands that create them.

name: Build CHUD STREAMS for Fire TV

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - "**.md"

permissions:
  contents: read

concurrency:
  group: chud-streams-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: zulu

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Restore signing key
        env:
          DIAL_KEYSTORE_BASE64: ${{ secrets.DIAL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DIAL_KEYSTORE_BASE64" ]; then
            echo "$DIAL_KEYSTORE_BASE64" | base64 -d > dial-release.jks
            echo "DIAL_KEYSTORE_FILE=dial-release.jks" >> "$GITHUB_ENV"
            echo "Signing with the CHUD STREAMS release key."
          else
            echo "::warning::No DIAL_KEYSTORE_BASE64 secret. This APK uses a one-off debug key, so to update CHUD STREAMS on the Fire TV you'll need to uninstall the old version first."
          fi

      - name: Build release APK
        env:
          DIAL_KEYSTORE_PASSWORD: ${{ secrets.DIAL_KEYSTORE_PASSWORD }}
          DIAL_KEY_ALIAS: ${{ secrets.DIAL_KEY_ALIAS }}
          DIAL_KEY_PASSWORD: ${{ secrets.DIAL_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:tv:assembleRelease --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          apk=$(ls app/tv/build/outputs/published-apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$apk" ]; then
            apk=$(ls app/tv/build/outputs/apk/release/*.apk | head -n 1)
          fi
          cp "$apk" "dist/chud-streams-${{ github.run_number }}.apk"
          ls -la dist

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chud-streams-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
